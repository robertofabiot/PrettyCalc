[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prettycalc"
version = "0.1.0"
description = "Calculadora interactiva de Álgebra Lineal en Python y PySide6"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
]

[project.scripts]
prettycalc = "prettycalc.main:run_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["prettycalc*"]
